openapi: 3.1.0
info:
  title: Lofish Market API
  version: 1.0.0
  description: |
    API untuk sistem Point of Sale (POS) Lofish Market.

    ## Authentication
    Semua endpoint (kecuali `/login` dan `/webhook/*`) memerlukan Bearer token authentication.

    Token didapatkan dari endpoint `/login` dan harus disertakan di header:
    ```
    Authorization: Bearer YOUR_TOKEN_HERE
    ```

  contact:
    name: API Support
    email: support@lofishmarket.com

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://api.lofishmarket.com
    description: Production server

tags:
  - name: Authentication
    description: Login and session management
  - name: Transactions
    description: Transaction/selling operations
  - name: Products
    description: Product and stock management
  - name: Users
    description: User and role management
  - name: Webhooks
    description: External webhook endpoints

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session token dari endpoint /login

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: "Error message"
        login:
          type: boolean
          example: false

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8

    User:
      type: object
      properties:
        id:
          type: string
          example: "user123"
        username:
          type: string
          example: "kasir01"
        email:
          type: string
          example: "kasir01@example.com"

    Market:
      type: object
      properties:
        id:
          type: string
          example: "market01"
        name:
          type: string
          example: "Toko Pusat"

    PaymentMethod:
      type: object
      properties:
        id:
          type: string
          example: "pm01"
        name:
          type: string
          example: "QRIS"

    Stock:
      type: object
      properties:
        id:
          type: string
          example: "stock001"
        name:
          type: string
          example: "Produk A"
        qty:
          type: number
          example: 100

    Price:
      type: object
      properties:
        id:
          type: string
          example: "price001"
        price:
          type: number
          example: 25000

    TransactionItem:
      type: object
      properties:
        id:
          type: string
          example: "detail001"
        qty:
          type: number
          example: 2
        mod_price:
          type: number
          example: 25000
        total_price:
          type: number
          example: 50000
        note:
          type: string
          nullable: true
        stock:
          $ref: "#/components/schemas/Stock"
        price:
          $ref: "#/components/schemas/Price"

    Transaction:
      type: object
      properties:
        id:
          type: string
          example: "abc123xyz"
        payment_id:
          type: string
          nullable: true
          example: "xendit_payment_123"
        total_price:
          type: number
          example: 150000
        payed_money:
          type: number
          example: 200000
        change_money:
          type: number
          example: 50000
        is_paid:
          type: string
          enum: ["1", "2", "3"]
          example: "3"
          description: "1=overview, 2=unpaid, 3=paid"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00.000Z"
        user:
          $ref: "#/components/schemas/User"
        market:
          $ref: "#/components/schemas/Market"
        payment:
          $ref: "#/components/schemas/PaymentMethod"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionItem"

security:
  - bearerAuth: []

paths:
  /login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user and get session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: "kasir01"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transaction/selling/list:
    get:
      tags:
        - Transactions
      summary: Get transaction list
      description: Get paginated list of transactions with filtering options
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Items per page
        - name: start_date
          in: query
          schema:
            type: string
            format: date
          description: Filter from date (YYYY-MM-DD)
        - name: end_date
          in: query
          schema:
            type: string
            format: date
          description: Filter to date (YYYY-MM-DD)
        - name: is_paid
          in: query
          schema:
            type: string
            enum: ["1", "2", "3"]
          description: Payment status (1=overview, 2=unpaid, 3=paid)
        - name: user_id
          in: query
          schema:
            type: string
          description: Filter by user/cashier
        - name: market_id
          in: query
          schema:
            type: string
          description: Filter by market/store
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transaction/selling/byid/{id}:
    get:
      tags:
        - Transactions
      summary: Get transaction by ID
      description: Get detailed transaction information including items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Transaction ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transaction/selling/create:
    post:
      tags:
        - Transactions
      summary: Create new transaction
      description: Create a new selling transaction (checkout)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - total_price
                - payed_money
                - change_money
                - is_paid
                - payment_method_id
                - market_id
                - user_id
                - items
              properties:
                total_price:
                  type: number
                  example: 150000
                payed_money:
                  type: number
                  example: 200000
                change_money:
                  type: number
                  example: 50000
                is_paid:
                  type: string
                  example: "3"
                payment_method_id:
                  type: string
                  example: "pm01"
                market_id:
                  type: string
                  example: "market01"
                user_id:
                  type: string
                  example: "user123"
                items:
                  type: string
                  description: JSON string array of items
                  example: '[{"stock_id":"stock001","qty":2,"price":25000,"total_price":50000}]'
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Transaction created successfully"
                  data:
                    $ref: "#/components/schemas/Transaction"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /webhook/xendit:
    post:
      tags:
        - Webhooks
      summary: Xendit payment webhook
      description: Receive payment notifications from Xendit
      security: []
      parameters:
        - name: x-callback-token
          in: header
          required: true
          schema:
            type: string
          description: Xendit callback verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: "qr.payment"
                data:
                  type: object
                  properties:
                    reference_id:
                      type: string
                      example: "testing_id_123"
                    amount:
                      type: number
                      example: 1500
                    status:
                      type: string
                      example: "SUCCEEDED"
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true
        "401":
          description: Invalid callback token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
